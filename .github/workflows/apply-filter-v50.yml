name: Apply PD2 latest filter fixes
on:
  push:
    paths:
      - 'scripts/update_filter_v52.py'
      - 'scripts/update_filter_v53.py'
      - 'scripts/update_filter_v54.py'
      - 'scripts/update_filter_v55.py'
      - 'scripts/update_filter_v56.py'
      - 'scripts/update_filter_v57.py'
      - 'scripts/update_filter_v58.py'
      - 'scripts/update_filter_v59.py'
      - 'scripts/audit_labels_v60.py'
      - 'scripts/update_filter_v60.py'
      - 'scripts/update_filter_v61.py'
      - 'scripts/update_filter_v62.py'
      - 'scripts/update_filter_v63.py'
      - 'scripts/update_filter_v64.py'
      - 'scripts/update_filter_v65.py'
      - 'scripts/update_filter_v66.py'
      - 'scripts/update_filter_v67.py'
      - 'scripts/audit_score_v68.py'
      - 'scripts/update_filter_v69.py'
      - 'scripts/audit_formula_compiler_v70.py'
      - 'scripts/update_filter_v70.py'
      - 'scripts/audit_score_labels_v71.py'
      - 'scripts/update_filter_v71.py'
      - 'scripts/audit_helm_v72.py'
      - 'scripts/update_filter_v72.py'
      - 'scripts/audit_helm_regression_v72.py'
      - 'scripts/update_filter_v73.py'
      - 'scripts/audit_armor_regression_v73.py'
      - 'scripts/audit_slot_coverage_v74.py'
      - 'scripts/update_filter_v74.py'
      - 'scripts/audit_slot_regression_v74.py'
      - 'scripts/audit_spirit_keeper_v75.py'
      - 'scripts/update_filter_v68.py'
      - '.github/workflows/apply-filter-v50.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply v74 multi-category score coverage
        run: |
          python3 scripts/audit_spirit_keeper_v75.py
          python3 scripts/update_filter_v74.py
          python3 scripts/audit_formula_compiler_v70.py
          python3 scripts/audit_helm_regression_v72.py
          python3 scripts/audit_armor_regression_v73.py
          python3 scripts/audit_slot_regression_v74.py
      - name: Verify all five variants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('.').glob('Hiim-Hyper-*.filter'))
          assert len(files)>=5, f"Only {len(files)} variants found"
          for p in files:
              s=p.read_text(encoding='utf-8-sig')
              assert s.startswith('// v74:'), p
              assert 'OR (RARE ID BOOTS)' in s, p
              assert 'AND(MISC,!JEWELRY,!CHARM,!QUIVER,!RUNE,!GEM' in s, p
              assert s.count('Formula[RARESCORE]:')==1, p
              assert '4.8+/7' not in s, p
              assert '%FORMULARARESCORE%' in s, p
              assert not any('Score 6.0-6.49/7' in line for line in s.splitlines() if line.startswith('ItemDisplay[')), p
              assert 'SOCK==0' in s, p
              assert '%FORMULARARECASTER%' in s and '%FORMULARAREMELEE%' in s, p
              assert s.count('ItemDisplay[V21_SCORE_HOVER_ RARE ') == 15, p
              assert 'Rating 4.5-4.99/7' not in s, p
              assert 'Score %FORMULARARESCORE%/7' in s, p
              assert s.count('ItemDisplay[V21_SCORE_HOVER_ RARE ') == 15, p
              assert 'ItemDisplay[GROUND UNI !ID !ALLDISCOVERED !jew]:' in s, p
              assert 'ItemDisplay[GROUND SET !ID !ALLDISCOVERED]:' in s, p
              assert 'ItemDisplay[GROUND UNI !ID ALLDISCOVERED !ALLOWNED !jew]:' in s, p
              assert 'Score ' in s and '/7' in s, p
              assert 'ItemDisplay[V21_SCORE_HOVER_' not in s or 'Score ' in s, p
              assert 'ItemDisplay[GROUND NMAG (ci0 OR ci1 OR ci2 OR ci3)]:' in s, p
              assert 'ItemDisplay[GROUND UNI !ETH !(4_STAR_UNIQUE OR 3_STAR_UNIQUE OR 2_STAR_UNIQUE OR amu OR rin OR jew' in s, p
              assert 'ItemDisplay[GROUND UNI ETH !(4_STAR_ETH_UNIQUE OR 3_STAR_ETH_UNIQUE OR 2_STAR_ETH_UNIQUE OR amu OR rin OR jew' in s, p
              assert 'ItemDisplay[GROUND SET (wsp OR ghm)]:' in s, p
              assert 'ItemDisplay[GROUND SET !(2_STAR_SET OR 3_STAR_SET OR 4_STAR_SET OR amu OR rin OR LLD_SET OR (ETH WEAPON))]:' in s, p
              assert 'ItemDisplay[GROUND UNI !ETH (0_STAR_UNIQUE OR NO_STAR_UNIQUE) !(amu OR rin OR jew)]:' in s, p
              assert not any('$f(' in line.split(']:',1)[1] for line in s.splitlines() if line.startswith('ItemDisplay[') and ']:' in line), p
              assert 'ItemDisplay[GROUND SET (ghm OR fhl' in s, p
              assert 'ItemDisplay[GROUND (NMAG OR MAG) (aqv OR aqv2 OR aqv3 OR cqv OR cqv2 OR cqv3)]:' in s, p
              assert '$f(ROUND(RARE' not in s, p
              assert 'ItemDisplay[GROUND UNI !ETH (7sm OR 7vo' in s, p
              assert 'ItemDisplay[GROUND MAG WEAPON]:' in s, p
              assert 'ItemDisplay[GROUND MAG (GLOVES OR BOOTS OR BELT OR rin)]:' in s, p
              assert 'ItemDisplay[GROUND MAG (ci2 OR ci3)]: %NAME%{%NAME%}' in s, p
              assert 'ItemDisplay[GROUND MAG (HELM OR CIRC OR amu) !(ci2 OR ci3)]:' in s, p
              assert 'ItemDisplay[GROUND (GLOVES OR BOOTS) (MAG OR NMAG)]:' in s, p
              assert 'ItemDisplay[GROUND MAG EQ2]:' in s, p
              assert 'ItemDisplay[GROUND MAG SHIELD]:' in s, p
              assert 'ItemDisplay[GROUND NMAG !RW EQ2' in s, p
              assert 'ItemDisplay[GROUND NMAG !RW SHIELD' in s, p
              assert 'ItemDisplay[GROUND FILTLVL>2 MAG !ID HELM' in s, p
              assert 'ItemDisplay[GROUND FILTLVL>2 NMAG !RW !SUP WEAPON' in s, p
              assert 'ItemDisplay[GROUND jew !(RARE OR UNI OR MAG)]' in s if ('Blue-Jewels' in p.name or 'Hello-Kitty' in p.name) else True, p
              print('Verified',p.name)
          PY
      - name: Commit updated filters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.filter'
          if ! git diff --cached --quiet; then
            git commit -m "v74: score rare jewels gloves boots amulets belts quivers"
            git push
          fi
