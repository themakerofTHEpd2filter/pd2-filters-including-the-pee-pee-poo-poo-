name: Apply PD2 v50 filter updates
on:
  push:
    paths:
      - 'scripts/update_filter_v50.py'
      - 'scripts/add_hello_kitty.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update all filters and add blue-jewel and Hello Kitty variants
        run: |
          python3 scripts/update_filter_v50.py
          python3 scripts/add_hello_kitty.py
      - name: Commit generated filter files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.filter'
          if ! git diff --cached --quiet; then
            git commit -m "v50: show unique belts, boost circlets, correct mauls, add blue jewel variant"
            git push
          fi
