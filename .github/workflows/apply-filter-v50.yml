name: Apply PD2 v50 filter updates
on:
  push:
    paths:
      - 'scripts/update_filter_v50.py'
      - 'scripts/add_hello_kitty.py'
      - 'scripts/update_filter_v51.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate all variants and apply v51 scoring and highlighting
        run: |
          python3 scripts/update_filter_v50.py
          python3 scripts/add_hello_kitty.py
          python3 scripts/update_filter_v51.py
      - name: Commit generated filter files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.filter'
          if ! git diff --cached --quiet; then
            git commit -m "v51: rare helm scores, unique jewelry, premium belts, mauls"
            git push
          fi
