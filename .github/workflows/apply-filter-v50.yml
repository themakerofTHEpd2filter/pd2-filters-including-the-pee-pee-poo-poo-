name: Apply PD2 latest filter fixes
on:
  push:
    paths:
      - 'scripts/update_filter_v52.py'
      - 'scripts/update_filter_v53.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply v52 clean-up and v53 ground label repair
        run: |
          python3 scripts/update_filter_v52.py
          python3 scripts/update_filter_v53.py
      - name: Verify all five variants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('.').glob('Hiim-Hyper-*.filter'))
          assert len(files)>=5, f"Only {len(files)} variants found"
          for p in files:
              s=p.read_text(encoding='utf-8-sig')
              assert s.startswith('// v53:'), p
              assert 'ItemDisplay[GROUND FILTLVL>2 MAG !ID HELM' in s, p
              assert 'ItemDisplay[GROUND FILTLVL>2 NMAG !RW !SUP WEAPON' in s, p
              assert 'ItemDisplay[GROUND jew !(RARE OR UNI OR MAG)]' in s if ('Blue-Jewels' in p.name or 'Hello-Kitty' in p.name) else True, p
              print('Verified',p.name)
          PY
      - name: Commit updated filters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.filter'
          if ! git diff --cached --quiet; then
            git commit -m "v53: fix malformed score labels and overlaps"
            git push
          fi
